  # --- time expressions -----------------------------------------------------
  - said: "दो दिन से"
    roman: "do din se"
    likely_means: "since two days / for the last two days"
    doctor_display: "\"since two days\" (duration = 2 days)"
    category: time
    note: "Keep the DURATION, not the Indian-English idiom."
    review: NEEDS-NATIVE-REVIEW
  - said: "कल रात से"
    roman: "kal raat se"
    likely_means: "since last night"
    doctor_display: "\"since last night\""
    category: time
    note: "कल means BOTH yesterday and tomorrow in Hindi; tense decides. A flipped कल is a real error mode."
    review: NEEDS-NATIVE-REVIEW
  - said: "हफ़्ते भर से"
    roman: "hafte bhar se"
    likely_means: "for about a week"
    doctor_display: "\"about a week\""
    category: time
    review: NEEDS-NATIVE-REVIEW
  - said: "कभी कभी"
    roman: "kabhi kabhi"
    likely_means: "on and off, sometimes — NOT constant"
    doctor_display: "\"on and off\" (intermittent)"
    category: time
    note: "Dropping this changes the clinical picture."
    review: NEEDS-NATIVE-REVIEW
  - said: "बहुत दिनों से"
    roman: "bahut dinon se"
    likely_means: "for a long time — vague, weeks to years"
    doctor_display: "\"a long time\" (vague)"
    category: time
    note: "Must NOT be converted into a number of days."
    review: NEEDS-NATIVE-REVIEW
  - said: "खाने के बाद"
    roman: "khaane ke baad"
    likely_means: "after food"
    doctor_display: "\"after food\""
    category: time
    review: NEEDS-NATIVE-REVIEW

  # --- Hinglish: English words inside a Hindi sentence ---------------------
  - said: "डॉक्टर साहब, तीन दिन से फीवर है"
    roman: "doctor sahab, teen din se fever hai"
    likely_means: "Doctor, I have had fever for three days"
    doctor_display: "\"fever for three days\""
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "टैबलेट ख़त्म हो गई"
    roman: "tablet khatm ho gayi"
    likely_means: "The tablets are finished"
    doctor_display: "\"tablets finished\""
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "स्कैन करवाना पड़ेगा क्या"
    roman: "scan karwana padega kya"
    likely_means: "Will I need to get a scan?"
    doctor_display: "\"do I need a scan?\""
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "ब्लड टेस्ट करवाया था"
    roman: "blood test karwaya tha"
    likely_means: "I had a blood test done"
    doctor_display: "\"had a blood test\""
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "एक शून्य एक"
    roman: "ek shoonya ek"
    likely_means: "1-0-1: one morning, none at noon, one at night"
    doctor_display: "1-0-1 (morning/night)"
    category: dosing_shorthand
    note: "Dosing shorthand goes to the SCHEDULE fields, never to free text."
    review: NEEDS-NATIVE-REVIEW
  - said: "आधी गोली"
    roman: "aadhi goli"
    likely_means: "half a tablet"
    doctor_display: "half tablet"
    category: dosing_shorthand
    note: "Goes to the SCHEDULE as 0.5 since the docs/04 §2 change of 2026-10-17 — not to notes. The read-back says it aloud as आधी (gendered: आधा with a masculine form noun)."
    review: NEEDS-NATIVE-REVIEW
  - said: "एक चम्मच"
    roman: "ek chammach"
    likely_means: "one spoon (of syrup) — count=1 with form=syrup"
    doctor_display: "1 spoon (syrup)"
    category: dosing_shorthand
    review: NEEDS-NATIVE-REVIEW

  # --- non-clinical phrases that must not be expanded ----------------------
  - said: "भगवान की दया से"
    roman: "bhagwaan ki daya se"
    likely_means: "by God's grace — a filler with no clinical content"
    doctor_display: "(figure of speech)"
    category: filler
    review: NEEDS-NATIVE-REVIEW
  - said: "गाँव से आया हूँ"
    roman: "gaon se aaya hoon"
    likely_means: "I came from my village — travel history, not a symptom"
    doctor_display: "\"came from my village\" (travel history)"
    category: general
    review: NEEDS-NATIVE-REVIEW
