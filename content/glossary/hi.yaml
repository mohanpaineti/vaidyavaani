    review: NEEDS-NATIVE-REVIEW
  - said: "सूजन"
    roman: "soojan"
    likely_means: "swelling"
    doctor_display: "\"swelling\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "तबीयत ठीक नहीं है"
    roman: "tabiyat theek nahin hai"
    likely_means: "not feeling well — the universal opening line, no specific symptom"
    doctor_display: "\"not feeling well\" (no symptom stated)"
    category: general
    note: "Must NOT be expanded into symptoms the patient did not state."
    review: NEEDS-NATIVE-REVIEW

  # --- body parts -----------------------------------------------------------
  - said: "पेट"
    roman: "pet"
    likely_means: "stomach/abdomen — the whole belly"
    doctor_display: "\"stomach\" (whole abdomen)"
    category: body_part
    review: NEEDS-NATIVE-REVIEW
  - said: "सीना"
    roman: "seena"
    likely_means: "chest"
    doctor_display: "\"chest\""
    category: body_part
    review: NEEDS-NATIVE-REVIEW
  - said: "कमर"
    roman: "kamar"
    likely_means: "lower back / waist — NOT 'hip'"
    doctor_display: "\"kamar\" (lower back/waist)"
    category: body_part
    note: "Common mistranslation: rendered as 'hip'. In practice patients mean the lower back."
    review: NEEDS-NATIVE-REVIEW
  - said: "पीठ"
    roman: "peeth"
    likely_means: "upper/mid back"
    doctor_display: "\"back\""
    category: body_part
    review: NEEDS-NATIVE-REVIEW
  - said: "हाथ"
    roman: "haath"
    likely_means: "hand OR whole arm"
    doctor_display: "\"haath\" (hand or arm)"
    category: body_part
    review: NEEDS-NATIVE-REVIEW
  - said: "पैर"
    roman: "pair"
    likely_means: "foot OR whole leg"
    doctor_display: "\"pair\" (foot or leg)"
    category: body_part
    review: NEEDS-NATIVE-REVIEW
  - said: "सिर"
    roman: "sir"
    likely_means: "head"
