  - said: "बदन दर्द"
    roman: "badan dard"
    likely_means: "body ache"
    doctor_display: "\"body ache\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "पेट फूलना"
    roman: "pet phoolna"
