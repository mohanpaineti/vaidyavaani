# content/glossary/hi.yaml — Hindi lay-term glossary for a Bengaluru OPD
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  DRAFTED, NOT VERIFIED. Every entry carries review: NEEDS-NATIVE-REVIEW ║
# ║  A native Hindi speaker clears it per entry by setting review: ok.      ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Used two ways — see the header of content/glossary/ta.yaml for the full
# rules. `likely_means` is a HYPOTHESIS shown to the doctor in quotes, never a
# diagnosis, and never spoken to the patient.
#
# Who this is for: in a Bengaluru government OPD the Hindi speaker is usually a
# migrant worker from Bihar, UP, Jharkhand, West Bengal or the North-East using
# Hindi as a link language, not a first language. So this list leans towards
# plain Hindustani and away from Sanskritised or Delhi-register vocabulary, and
# a reviewer should assume the speaker's Hindi may itself be second-language.

schema_version: 1
language: hi
language_name_en: Hindi

review:
  status: pending
  reviewer: ""
  reviewed_at: ""
  how_to_review: >
    Per entry: would a migrant worker in a Bengaluru OPD actually say this, and
    is likely_means the most common meaning rather than a merely possible one?
    Flag anything that is Delhi/Mumbai-specific slang a Bihari speaker would
    not use.

entries:
  # --- conditions in lay terms ---------------------------------------------
  - said: "शुगर है"
    roman: "sugar hai"
    likely_means: "I have diabetes"
    doctor_display: "\"sugar\" (diabetes)"
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "बीपी है"
    roman: "BP hai"
    likely_means: "I have blood pressure trouble — usually hypertension"
    doctor_display: "\"BP\" (blood pressure)"
    category: code_mix
    note: "Ambiguous high vs low. The doctor must ask."
    review: NEEDS-NATIVE-REVIEW
  - said: "गैस बनती है"
    roman: "gas banti hai"
    likely_means: "bloating, acidity, wind — sometimes how chest pain gets described"
    doctor_display: "\"gas\" (bloating/acidity)"
    category: symptom
    note: "SAFETY: 'gas' in the chest can be an MI. Pairs with the chest-pain red flag."
    review: NEEDS-NATIVE-REVIEW
  - said: "शरीर में गर्मी"
    roman: "shareer mein garmi"
    likely_means: "body heat — a folk category, not a measured fever"
    doctor_display: "\"body heat\" (folk term — ask what exactly)"
    category: folk_concept
    note: "Translating this as 'fever' would be an invention."
    review: NEEDS-NATIVE-REVIEW
  - said: "कमज़ोरी"
    roman: "kamzori"
    likely_means: "weakness, low energy"
    doctor_display: "\"weakness\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "दस्त"
    roman: "dast"
    likely_means: "loose motion, diarrhoea"
    doctor_display: "\"loose motion\" (diarrhoea)"
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "लूज़ मोशन"
    roman: "loose motion"
    likely_means: "diarrhoea — the English phrase used inside Hindi"
    doctor_display: "\"loose motion\" (diarrhoea)"
    category: code_mix
    review: NEEDS-NATIVE-REVIEW
  - said: "चक्कर आता है"
    roman: "chakkar aata hai"
    likely_means: "giddiness, dizziness"
    doctor_display: "\"giddiness\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "बेहोश हो गया"
    roman: "behosh ho gaya"
    likely_means: "fainted, lost consciousness"
    doctor_display: "\"fainted\""
    category: symptom
    note: "SAFETY: urgent red flag."
    review: NEEDS-NATIVE-REVIEW
  - said: "उल्टी"
    roman: "ulti"
    likely_means: "vomiting"
    doctor_display: "\"vomiting\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "जी मिचलाना"
    roman: "ji michlaana"
    likely_means: "nausea"
    doctor_display: "\"nausea\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "सीने में जलन"
    roman: "seene mein jalan"
    likely_means: "burning in the chest, heartburn"
    doctor_display: "\"burning in the chest\" (heartburn)"
    category: symptom
    note: "SAFETY: overlaps with cardiac chest pain. Watch-level flag."
    review: NEEDS-NATIVE-REVIEW
  - said: "साँस फूलती है"
    roman: "saans phoolti hai"
    likely_means: "breathlessness on exertion"
    doctor_display: "\"breathless\""
    category: symptom
    note: "SAFETY: urgent red flag."
    review: NEEDS-NATIVE-REVIEW
  - said: "ज़ुकाम"
    roman: "zukaam"
    likely_means: "cold, runny nose"
    doctor_display: "\"cold\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "खाँसी"
    roman: "khaansi"
