  - said: "क़ब्ज़"
    roman: "kabz"
    likely_means: "constipation"
    doctor_display: "\"constipation\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "खुजली"
    roman: "khujli"
    likely_means: "itching"
    doctor_display: "\"itching\""
