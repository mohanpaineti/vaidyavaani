    doctor_display: "\"cough\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "बुख़ार"
    roman: "bukhaar"
    likely_means: "fever"
    doctor_display: "\"fever\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "ठंड लगकर बुख़ार"
    roman: "thand lagkar bukhaar"
    likely_means: "fever with chills/rigors"
    doctor_display: "\"fever with chills\""
    category: symptom
    review: NEEDS-NATIVE-REVIEW
  - said: "पेशाब में जलन"
    roman: "peshaab mein jalan"
    likely_means: "burning when passing urine"
    doctor_display: "\"burning urination\""
    category: symptom
